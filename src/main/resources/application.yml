```yaml
name: CI/CD Deploy EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: product-comparison-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Build da aplicação
        run: ./mvnw clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push da imagem Docker
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: true

          script: |
            set -xe

            echo "======================================"
            echo "ATUALIZANDO SISTEMA"
            echo "======================================"

            sudo apt-get update -y || true

            echo "======================================"
            echo "INICIANDO DOCKER"
            echo "======================================"

            sudo systemctl start docker
            sudo systemctl enable docker

            docker --version
            docker ps

            echo "======================================"
            echo "LOGIN DOCKER HUB"
            echo "======================================"

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "======================================"
            echo "CRIANDO REDE"
            echo "======================================"

            docker network create monitoring-network || true

            echo "======================================"
            echo "REMOVENDO CONTAINERS ANTIGOS"
            echo "======================================"

            docker stop product-comparison-app || true
            docker rm product-comparison-app || true

            docker stop zipkin || true
            docker rm zipkin || true

            docker stop prometheus || true
            docker rm prometheus || true

            docker stop grafana || true
            docker rm grafana || true

            echo "======================================"
            echo "PULL DA NOVA IMAGEM"
            echo "======================================"

            docker pull ${{ secrets.DOCKER_USERNAME }}/product-comparison-app:latest

            echo "======================================"
            echo "SUBINDO ZIPKIN"
            echo "======================================"

            docker run -d \
              --name zipkin \
              --network monitoring-network \
              -p 9411:9411 \
              openzipkin/zipkin:2.24

            echo "======================================"
            echo "SUBINDO PROMETHEUS"
            echo "======================================"

            docker run -d \
              --name prometheus \
              --network monitoring-network \
              -p 9090:9090 \
              prom/prometheus:v2.45.0

            echo "======================================"
            echo "SUBINDO GRAFANA"
            echo "======================================"

            docker run -d \
              --name grafana \
              --network monitoring-network \
              -p 3000:3000 \
              -e GF_SECURITY_ADMIN_PASSWORD=admin123 \
              grafana/grafana:10.0.0

            echo "======================================"
            echo "SUBINDO APLICAÇÃO"
            echo "======================================"

            docker run -d \
              --name product-comparison-app \
              --network monitoring-network \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=docker \
              -e DATABASE_URL=jdbc:h2:mem:product \
              -e TRACING_ENABLED=true \
              -e ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans \
              -e MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans \
              -e LOG_LEVEL=INFO \
              ${{ secrets.DOCKER_USERNAME }}/product-comparison-app:latest

            echo "======================================"
            echo "AGUARDANDO APLICAÇÃO"
            echo "======================================"

            sleep 30

            echo "======================================"
            echo "VALIDANDO CONTAINERS"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "LOGS DA APLICAÇÃO"
            echo "======================================"

            docker logs product-comparison-app --tail 100

            echo "======================================"
            echo "TESTANDO HEALTHCHECK"
            echo "======================================"

            curl http://localhost:8080/actuator/health || true

            echo "======================================"
            echo "DEPLOY FINALIZADO"
            echo "======================================"
```
